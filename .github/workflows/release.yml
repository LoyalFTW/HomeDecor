name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Package and Upload
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28 # v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          server_url = os.environ["SERVER_URL"]
          release_url = f"{server_url}/{repo}/releases/tag/{urllib.parse.quote(tag)}"
          curseforge_url = "https://www.curseforge.com/wow/addons/home-decor"

          release_request = urllib.request.Request(
              f'{os.environ["API_URL"]}/repos/{repo}/releases/tags/{urllib.parse.quote(tag)}',
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  "User-Agent": "HomeDecorReleaseBot (GitHub Actions)",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(release_request, timeout=30) as response:
              release = json.loads(response.read().decode("utf-8"))

          body = release.get("body", "").strip()
          version_heading = re.compile(
              r"(?mi)^##\s+\[?(v?\d+(?:\.\d+)+)\]?(?:\s|$)"
          )
          headings = list(version_heading.finditer(body))
          accepted_versions = {tag.lower(), tag.removeprefix("v").removeprefix("V").lower()}
          notes = ""

          for index, heading in enumerate(headings):
              if heading.group(1).lower() not in accepted_versions:
                  continue
              start = body.find("\n", heading.end())
              start = heading.end() if start == -1 else start + 1
              end = headings[index + 1].start() if index + 1 < len(headings) else len(body)
              notes = body[start:end].strip()
              break

          if not notes and body:
              notes = re.split(r"(?m)^\s*---+\s*$", body, maxsplit=1)[0].strip()

          notes = "\n".join(
              line for line in notes.splitlines()
              if not ("full changelog" in line.lower() and "previous releases" in line.lower())
          ).strip()

          if not notes:
              notes = "A new HomeDecor update is available."

          if len(notes) > 1800:
              notes = notes[:1790].rsplit("\n", 1)[0].rstrip()
              notes += "\n\n...more details in the full release notes."

          payload = {
              "username": "HomeDecor Changelog",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"HomeDecor {tag} released",
                  "url": release_url,
                  "description": f"{notes}\n\n[View full release notes]({release_url})",
                  "color": 15120430,
                  "fields": [{
                      "name": "Download",
                      "value": f"[GitHub Release]({release_url}) | [CurseForge]({curseforge_url})",
                      "inline": False,
                  }],
                  "footer": {
                      "text": "HomeDecor - Housing made easier",
                  },
              }],
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"] + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "HomeDecorReleaseBot (GitHub Actions)",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              message = json.loads(response.read().decode("utf-8"))

          guild_id = message.get("guild_id")
          channel_id = message.get("channel_id")
          message_id = message.get("id")
          print(f"Discord accepted message ID {message_id} in channel ID {channel_id}.")
          if guild_id and channel_id and message_id:
              print(f"Discord message link: https://discord.com/channels/{guild_id}/{channel_id}/{message_id}")
          PY

  discord-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Test Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "username": "HomeDecor Changelog",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "HomeDecor Discord connection test",
                  "description": "This test confirms which Discord channel receives release announcements.",
                  "color": 15120430,
                  "footer": {
                      "text": "HomeDecor - Release workflow test",
                  },
              }],
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"] + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "HomeDecorReleaseBot (GitHub Actions)",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              message = json.loads(response.read().decode("utf-8"))

          guild_id = message.get("guild_id")
          channel_id = message.get("channel_id")
          message_id = message.get("id")
          print(f"Discord accepted message ID {message_id} in channel ID {channel_id}.")
          if guild_id and channel_id and message_id:
              print(f"Discord message link: https://discord.com/channels/{guild_id}/{channel_id}/{message_id}")
          PY
